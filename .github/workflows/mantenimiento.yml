name: Mantenimiento/Activar
on:
  schedule: #Ejecución automática
    - cron: '00 */4 * * *'  #Corre cada 4 horas
  workflow_dispatch: # Permite ejecución manual desde la pestaña Actions

jobs:
  mantenimiento:
    runs-on: ubuntu-latest #Máquina virtual para hacer la corrida
    timeout-minutes: 10   
    permissions:
      actions: write            # necesario para reactivar workflows con la API

    steps:
      #1. Reactivar workflows (GitHub)
      - name: Reactivar workflows 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | #Llama la API de Github y hace click en"Enable workflow", echo pone mensaje en la corrida
          for wf in pipeline.yml mantenimiento.yml; do
            gh api --method PUT \ 
              "repos/${{ github.repository }}/actions/workflows/$wf/enable"
            echo "Workflow reactivado: $wf"
          done

      # 2. Mantener Neo4j activo 
      - name: Instalar driver de Neo4j
        if: always() #siempre, aunque paso anterio falle
        run: pip install neo4j #insatala driver de python de neo4j para conectarse

      - name: Consultar Neo4j
        if: always()
        env: #credenciales para acceder a Neo4j
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: | #EOF ejecuta con python todo el procedimiento
          python3 - <<'EOF'
          import os
          from neo4j import GraphDatabase

          uri = os.environ["NEO4J_URI"]
          user = os.environ["NEO4J_USER"]
          password = os.environ["NEO4J_PASSWORD"]

          if not uri:  #si no se encuentran las credenciales avisa con este mensaje
              raise ValueError("El secreto NEO4J_URI está vacío - revisar los secretos del repositorio")

          driver = GraphDatabase.driver(uri, auth=(user, password)) #abre la conexión con Neo4j
          with driver.session() as session:
              n = session.run("MATCH (s:SRARun) RETURN count(s) AS n").single()["n"] #hace una consulta
              print(f"Neo4j activo - {n} nodos SRARun")
          driver.close() #cierra conexión
          EOF

      # 3. Mantener Streamlit activo
      - name: Instalar navegador (Playwright) #Implementación de Playwrigth para visitar página web
        if: always()
        continue-on-error: true
        run: |
          pip install playwright  #Librería
          python3 -m playwright install --with-deps chromium  #descarga navegador y dependencias
          
      - name: Consultar la página de Streamlit
        if: always()
        run: |  #abre la página, si esta dormida la despierta
          python3 - <<'EOF'
          import re
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout
   
          URL = "https://tb-mx-vigilancia.streamlit.app/"
   
          with sync_playwright() as p: #abre chromium y una pestaña para abrir la página
            browser = p.chromium.launch()
            page = browser.new_page()
            page.goto(URL, wait_until="domcontentloaded", timeout=60000)
            boton = page.get_by_role("button", name=re.compile("get this app back up", re.I)) #busca botón
            try:
              boton.wait_for(timeout=15000)
              boton.click()
              print("La app estaba dormida: se pulsó el botón para despertarla")
            except PWTimeout:
              print("La app estaba despierta")
            page.wait_for_timeout(60000) #manitene la ventana abierta para que la vista cuenta 
            browser.close()
          EOF
