name: Actualizar pipeline TB-MX

# Busca muestras nuevas en NCBI, las analiza con TB-Profiler, las carga en Neo4j,
# guarda la metadata actualizada en el repositorio y publica los resultados JSON
# como un release de GitHub.

on:
  workflow_dispatch:            # ejecución manual desde la pestaña Actions
  schedule:
    - cron: '0 6 1 */2 *'       # automático: día 1 de cada dos meses, 06:00 UTC

concurrency: #No permite dos corridas/actualizaciones a la vez
  group: pipeline-tb-mx
  cancel-in-progress: false
  
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 340        # 5 h 40 min (suficiente para ~30 muestras nuevas)
    permissions:
      contents: write           # crear el release y guardar metadata_cleaned.csv
    defaults:
      run:
        shell: bash -el {0}     # shell de login para que cada paso use el entorno de conda

    steps:
      # --- 1. Instalar software ---
      - name: Descargar repositorio
        uses: actions/checkout@v5

      # TB-Profiler se distribuye por bioconda (no está en PyPI).
      # Bioconda también instala bwa, samtools, bcftools y SRA Toolkit.
      - name: Configurar conda (Miniforge)
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: tbmx
          python-version: "3.11"
          channels: conda-forge,bioconda
          channel-priority: strict

      # Versiones fijadas para coincidir con los resultados históricos (corrida de junio 2025).
      # 02_run_tbprofiler.py rechaza cualquier resultado generado con otras versiones.
      - name: Instalar TB-Profiler y herramientas bioinformáticas
        run: |
          conda install -y tb-profiler=6.6.6 sra-tools entrez-direct \
            biopython neo4j-python-driver pandas scipy numpy pyyaml
          tb-profiler version
          prefetch --version

      # --force reemplaza la base de datos que viene incluida en el paquete de conda
      - name: Instalar base de datos tbdb (commit 0a909094, 5 ago 2025)
        run: |
          git clone https://github.com/jodyphelan/tbdb.git /tmp/tbdb
          cd /tmp/tbdb
          git checkout 0a909094
          tb-profiler create_db --prefix tbdb --load --force

      # --- 2. Restaurar resultados previos de TB-Profiler desde el último release de datos ---
      - name: Restaurar JSONs históricos
        run: |
          mkdir -p ~/json_cache
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} \
            --json tagName,name \
            --jq '[.[] | select(.tagName | contains("data"))] | .[0].tagName')
          echo "Usando release: $LATEST_TAG"

          gh release download "$LATEST_TAG" \
            --repo ${{ github.repository }} \
            --pattern "tb_mx_results_*.tar.gz" \
            --dir /tmp/

          TARFILE=$(ls /tmp/tb_mx_results_*.tar.gz | head -1)
          tar -xzf "$TARFILE" -C ~/json_cache/ --strip-components=1 2>/dev/null || \
          tar -xzf "$TARFILE" -C ~/json_cache/

          COUNT=$(ls ~/json_cache/*.results.json 2>/dev/null | wc -l)
          echo "JSONs restaurados: $COUNT"
          echo "json_count=$COUNT" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 3. Ejecutar el pipeline ---
      # Los scripts leen y escriben ~/metadata_cleaned.csv, por eso se copia la versión del repo
      - name: Copiar metadata_cleaned.csv al directorio de trabajo
        run: cp metadata_cleaned.csv ~/metadata_cleaned.csv

      - name: "Paso 1: Buscar runs nuevos en NCBI"
        run: python pipeline/01_fetch_ncbi.py

      - name: Verificar si hay runs nuevos
        id: check
        run: |
          PENDING=$(cat ~/pending_runs.txt 2>/dev/null || echo 0)
          echo "pending=$PENDING" >> $GITHUB_OUTPUT
          if [ -f ~/new_runs.txt ] && [ -s ~/new_runs.txt ]; then
            COUNT=$(wc -l < ~/new_runs.txt | tr -d ' ')
            echo "has_new=true"  >> $GITHUB_OUTPUT
            echo "count=$COUNT"  >> $GITHUB_OUTPUT
            echo "$COUNT RUNS NUEVOS A PROCESAR:"
            cat ~/new_runs.txt
            # Aviso visible arriba en la corrida (sección Annotations)
            if [ "$PENDING" -gt 0 ]; then
              echo "::warning title=Runs pendientes::Se encontraron $((COUNT + PENDING)) runs nuevos; se procesan $COUNT en esta corrida y quedan $PENDING pendientes. El pipeline se relanzará automáticamente al terminar."
            fi
          else
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "count=0"       >> $GITHUB_OUTPUT
            echo "SIN MUESTRAS NUEVAS - PIPELINE TERMINADO."
          fi

      - name: "Paso 2: Correr TB-Profiler en los runs nuevos"
        if: steps.check.outputs.has_new == 'true'
        run: python pipeline/02_run_tbprofiler.py

      - name: "Paso 3: Generar CSVs del grafo"
        if: steps.check.outputs.has_new == 'true'
        run: python pipeline/03_build_graph_csvs.py

      - name: "Paso 4: Cargar a Neo4j"
        if: steps.check.outputs.has_new == 'true'
        run: python pipeline/04_load_neo4j.py
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

      # Solo se ejecuta si la carga a Neo4j terminó bien
      - name: Guardar metadata_cleaned.csv actualizado
        if: steps.check.outputs.has_new == 'true'
        run: |
          cp ~/metadata_cleaned.csv metadata_cleaned.csv
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metadata_cleaned.csv
          git commit -m "Update metadata_cleaned.csv (${{ steps.check.outputs.count }} new runs)" || echo "Sin cambios en el CSV"
          git pull --rebase
          git push

      # --- 4. Publicar todos los resultados JSON (históricos + nuevos) como release ---
      - name: Empacar resultados JSON
        if: steps.check.outputs.has_new == 'true'
        run: |
          TOTAL=$(ls ~/json_cache/*.results.json | wc -l)
          echo "JSONs a empacar: $TOTAL"
          tar -czf /tmp/tb_mx_results_latest.tar.gz -C ~/json_cache .
          ls -lh /tmp/tb_mx_results_latest.tar.gz

      - name: Publicar release de datos
        if: steps.check.outputs.has_new == 'true'
        run: |
          # Incluye la hora: si el pipeline se relanza, puede publicar varios releases el mismo día
          TAG="v$(date +'%Y.%m.%d-%H%M')-data"
          TOTAL=$(ls ~/json_cache/*.results.json | wc -l)
          gh release create "$TAG" \
            --repo ${{ github.repository }} \
            --title "Datos TB-MX - $(date +'%d/%m/%Y') ($TOTAL muestras)" \
            --notes "Actualización automática: ${{ steps.check.outputs.count }} runs nuevos. Total acumulado: $TOTAL resultados de TB-Profiler." \
            /tmp/tb_mx_results_latest.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- 5. Resumen ---
      - name: Resumen del pipeline
        if: always()
        run: |
          echo "## Resultado del pipeline TB-MX" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Paso | Estado |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JSONs históricos restaurados | ${{ env.json_count }} archivos |" >> $GITHUB_STEP_SUMMARY
          echo "| Runs nuevos procesados | ${{ steps.check.outputs.count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Runs pendientes para la siguiente corrida | ${{ steps.check.outputs.pending || 0 }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check.outputs.has_new }}" = "true" ]; then
            echo "| TB-Profiler | Ejecutado |" >> $GITHUB_STEP_SUMMARY
            echo "| Neo4j | Actualizado |" >> $GITHUB_STEP_SUMMARY
            echo "| Release | Publicado |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| TB-Profiler | Sin muestras nuevas |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.check.outputs.pending || 0 }}" -gt 0 ]; then
            echo "| Relanzamiento | Automático si la corrida terminó bien (ver último paso) |" >> $GITHUB_STEP_SUMMARY
          fi

      # --- 6. Relanzar si quedaron runs pendientes ---
      # Solo si toda la corrida terminó bien; si algo falló, no se relanza para no repetir el error.
      - name: Relanzar el pipeline para los runs pendientes
        if: success() && steps.check.outputs.has_new == 'true' && steps.check.outputs.pending != '0'
        run: |
          gh workflow run pipeline.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
          echo "Pipeline relanzado: quedan ${{ steps.check.outputs.pending }} runs pendientes"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
