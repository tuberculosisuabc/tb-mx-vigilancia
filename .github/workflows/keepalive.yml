name: Mantener repositorio activo

# GitHub desactiva los workflows programados tras 60 días sin actividad en el
# repositorio; un commit vacío semanal los mantiene funcionando. Cada 6 horas
# además despierta la aplicación de Streamlit (eso no crea commits).

on:
  schedule:
    - cron: '0 */6 * * *'       # cada 6 horas: consultar Streamlit
    - cron: '30 6 * * 1'        # lunes 06:30 UTC: commit vacío
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        if: github.event.schedule == '30 6 * * 1' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5

      - name: Mantener el repositorio activo
        if: github.event.schedule == '30 6 * * 1' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep workflows active [skip ci]"
          git push

      - name: Consultar la aplicación de Streamlit
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10 \
            https://tb-mx-vigilancia.streamlit.app/)
          echo "Estado HTTP de Streamlit: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "La aplicación de Streamlit está activa"
          else
            echo "Estado inesperado: $STATUS (la aplicación puede estar iniciando)"
          fi
