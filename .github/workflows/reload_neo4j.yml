name: Recargar datos históricos en Neo4j

# Reconstruye el grafo a partir de los resultados de TB-Profiler del último release
# de datos y de metadata_cleaned.csv. Los nodos existentes se actualizan con MERGE,
# no se borran.

on:
  workflow_dispatch:

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install neo4j pandas scipy numpy

      # Mismo criterio que "Actualizar pipeline TB-MX": el release de datos más reciente,
      # que contiene todos los resultados (históricos + los de cada actualización)
      - name: Descargar resultados JSON del último release de datos
        run: |
          mkdir -p ~/json_cache
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} \
            --json tagName,name \
            --jq '[.[] | select(.tagName | contains("data"))] | .[0].tagName')
          echo "Usando release: $LATEST_TAG"

          gh release download "$LATEST_TAG" \
            --repo ${{ github.repository }} \
            --pattern "tb_mx_results_*.tar.gz" \
            --dir /tmp/

          TARFILE=$(ls /tmp/tb_mx_results_*.tar.gz | head -1)
          tar -xzf "$TARFILE" -C ~/json_cache/ --strip-components=1 2>/dev/null || \
          tar -xzf "$TARFILE" -C ~/json_cache/

          COUNT=$(ls ~/json_cache/*.results.json 2>/dev/null | wc -l)
          echo "JSONs extraídos: $COUNT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Todos los runs con resultado JSON se tratan como "nuevos", así se recargan todos
      - name: Preparar metadata y lista de runs
        run: |
          cp metadata_cleaned.csv ~/metadata_cleaned.csv

          python3 << 'PYEOF'
          import csv, os

          csv_path = os.path.expanduser("~/metadata_cleaned.csv")
          out_path = os.path.expanduser("~/new_runs.txt")
          json_dir = os.path.expanduser("~/json_cache/")

          runs = []
          with open(csv_path, newline="", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  run = row.get("Run", "").strip()
                  if run:
                      runs.append(run)

          # Solo los runs que tienen JSON disponible
          runs_con_json = [r for r in runs
                           if os.path.exists(os.path.join(json_dir, f"{r}.results.json"))]

          with open(out_path, "w") as f:
              f.write("\n".join(runs_con_json) + "\n")

          print(f"Runs en el CSV    : {len(runs)}")
          print(f"Con JSON en cache : {len(runs_con_json)}")
          print(f"Escrito en        : {out_path}")
          PYEOF

      - name: Generar CSVs del grafo a partir de los JSONs
        run: python pipeline/03_build_graph_csvs.py

      - name: Cargar todo a Neo4j
        run: python pipeline/04_load_neo4j.py
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

      - name: Resumen
        if: always()
        run: |
          echo "## Recarga de Neo4j completada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          JSON_COUNT=$(ls ~/json_cache/*.results.json 2>/dev/null | wc -l)
          RUNS_COUNT=$(wc -l < ~/new_runs.txt 2>/dev/null || echo 0)
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| JSONs en cache | $JSON_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Runs procesados | $RUNS_COUNT |" >> $GITHUB_STEP_SUMMARY
