#Reconstruye el grafo de Neo4j a partir de los resultados del último release. Solo manual
name: Recargar datos históricos en Neo4j
on:
  workflow_dispatch:

concurrency:
  group: pipeline-tb-mx
  cancel-in-progress: false #No permite dos recargas a la vez, espera. Mismas acciones que Actualizar

jobs:
  reload:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5 #copia codigos y metadata a la maquina virtual

      - name: Configurar Python 3.11
        uses: actions/setup-python@v6 #solo requiere python
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias de Python
        run: pip install neo4j pandas #librerías necesarias

      - name: Descargar resultados JSON del último release de datos
        run: |
          mkdir -p ~/json_cache
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} \ #busca release mas reciente
            --json tagName,name \
            --jq '[.[] | select(.tagName | contains("data"))] | .[0].tagName')
          echo "Usando release: $LATEST_TAG" #imprime que release se esta usando

          gh release download "$LATEST_TAG" \ #descarga release
            --repo ${{ github.repository }} \
            --pattern "tb_mx_results_*.tar.gz" \
            --dir /tmp/

          TARFILE=$(ls /tmp/tb_mx_results_*.tar.gz | head -1) #descomprime archivo
          tar -xzf "$TARFILE" -C ~/json_cache/ --strip-components=1 2>/dev/null || \
          tar -xzf "$TARFILE" -C ~/json_cache/

          COUNT=$(ls ~/json_cache/*.results.json 2>/dev/null | wc -l)
          echo "JSONs extraídos: $COUNT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar metadata y lista de runs #todas las muestras se tratan como nuevas
        run: | 
          cp metadata_cleaned.csv ~/metadata_cleaned.csv

          python3 << 'PYEOF' #ejecuta con python
          import csv, os

          csv_path = os.path.expanduser("~/metadata_cleaned.csv") #rutas de las carpetas
          out_path = os.path.expanduser("~/new_runs.txt")
          json_dir = os.path.expanduser("~/json_cache/")

          runs = [] #junta todos los runs de la metadata
          with open(csv_path, newline="", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  run = row.get("Run", "").strip()
                  if run:
                      runs.append(run)

          with open(out_path, "w") as f: #escribe la lista a reconstruir
              f.write("\n".join(runs) + "\n")

          print(f"Runs en el CSV : {len(runs)}")
          print(f"Con JSON en cache : {len(runs_con_json)}")
          print(f"Escrito en : {out_path}")
          PYEOF

      - name: Generar CSVs del grafo a partir de los JSONs
        run: python pipeline/03_build_graph_csvs.py

      - name: Vaciar la base de datos #borra base de datos para evitar duplicar
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import os
          from neo4j import GraphDatabase

          driver = GraphDatabase.driver(os.environ["NEO4J_URI"], auth=(os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"])) #se conecta a neo4j
          def borrar_lote(tx):  #borra toda la base en lotes de 1000 nodos para no exceder la memoria
              return tx.run("""
                  MATCH (n) WITH n LIMIT 1000
                  DETACH DELETE n
                  RETURN count(*) AS borrados
              """).single()["borrados"]
          with driver.session() as session:
              while session.execute_write(borrar_lote) > 0:  #reintenta si hay error
                  pass
              n = session.run("MATCH (n) RETURN count(n) AS n").single()["n"]
              print(f"Base de datos vaciada - nodos restantes: {n}") #comprueba base vacía
          driver.close()
          EOF

      - name: Cargar todo a Neo4j
        run: python pipeline/04_load_neo4j.py #carga csvs a la base
        env:
          NEO4J_URI:      ${{ secrets.NEO4J_URI }}
          NEO4J_USER:     ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

      - name: Resumen  #Resumen que se muestra en la corrida
        if: always()
        run: |
          echo "## Recarga de Neo4j completada" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          JSON_COUNT=$(ls ~/json_cache/*.results.json 2>/dev/null | wc -l)
          RUNS_COUNT=$(wc -l < ~/new_runs.txt 2>/dev/null || echo 0)
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| JSONs en cache | $JSON_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| Runs en la metadata | $RUNS_COUNT |" >> $GITHUB_STEP_SUMMARY
